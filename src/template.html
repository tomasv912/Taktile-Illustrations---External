<title>Taktile Illustration Motion</title>
<style>
  /* Söhne (Klim Type Foundry) is a licensed font, so it isn't bundled: it is used when it is
     installed on the machine, or when the licensed webfonts are dropped into fonts/ next to
     index.html (file names as Klim ships them). Otherwise the system sans takes over. */
  @font-face { font-family: "Söhne"; font-weight: 400; font-display: swap;
    src: local("Söhne Buch"), local("Söhne-Buch"), local("Sohne-Buch"), url("fonts/soehne-buch.woff2") format("woff2"); }
  @font-face { font-family: "Söhne"; font-weight: 500; font-display: swap;
    src: local("Söhne Kräftig"), local("Söhne-Kräftig"), local("Sohne-Kraftig"), url("fonts/soehne-kraftig.woff2") format("woff2"); }
  @font-face { font-family: "Söhne Mono"; font-weight: 400; font-display: swap;
    src: local("Söhne Mono Buch"), local("SöhneMono-Buch"), local("SohneMono-Buch"), url("fonts/soehne-mono-buch.woff2") format("woff2"); }
  @font-face { font-family: "Söhne Mono"; font-weight: 500; font-display: swap;
    src: local("Söhne Mono Kräftig"), local("SöhneMono-Kräftig"), local("SohneMono-Kraftig"), url("fonts/soehne-mono-kraftig.woff2") format("woff2"); }
  :root {
    --sans: "Söhne", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Söhne Mono", "Söhne", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root {
    --bg: #0B0A0A; --fill: #0B0A0A; --line: #FDFCFC; --inner: #353232;
    --text: #FDFCFC; --muted: #8a8686; --border: rgba(253,252,252,.09);
    --panel: #121111; --control: #1c1a1a; --accent: #FDFCFC;
    --inner-hot: #686565; --conn: #686565; --conn-hot: #FDFCFC;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F7F6F6; --fill: #F7F6F6; --line: #9A9797; --inner: #9A9797;
    --text: #0B0A0A; --muted: #686565; --border: rgba(11,10,10,.09);
    --panel: #FDFCFC; --control: #eeeded; --accent: #0B0A0A;
    --inner-hot: #686565; --conn: #9A9797; --conn-hot: #353232;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]):not([data-theme="light"]) {
      color-scheme: light;
      --bg: #F7F6F6; --fill: #F7F6F6; --line: #9A9797; --inner: #9A9797;
      --text: #0B0A0A; --muted: #686565; --border: rgba(11,10,10,.09);
      --panel: #FDFCFC; --control: #eeeded; --accent: #0B0A0A;
    --inner-hot: #686565; --conn: #9A9797; --conn-hot: #353232;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 var(--sans);
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s, color .3s;
  }
  .app { display: grid; grid-template-columns: 1fr 300px; min-height: 100vh; }
  main { padding: 24px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-bottom: 20px; }
  h1 { font-size: 14px; font-weight: 500; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 400; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .controls .label { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .grid[data-cols="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid[data-cols="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .card {
    position: relative; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg); overflow: hidden; transition: background-color .3s, border-color .3s;
  }
  .card svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .card .tag {
    position: absolute; top: 12px; left: 14px; z-index: 200; pointer-events: none;
    font: 11px/1.3 var(--mono); color: var(--muted); letter-spacing: .02em;
  }

  /* Figma colors → theme tokens (CSS beats SVG presentation attributes) */
  .card [fill="#0B0A0A"] { fill: var(--fill); }
  /* --otint is set by the Colorize outline toggle; --ohot (0..1) is how directly the shape is hovered */
  .card [stroke="#FDFCFC"] { stroke: color-mix(in srgb, var(--otint, var(--line)) calc(var(--ohot, 0) * 100%), var(--line)); }
  .card [fill="#FDFCFC"] { fill: var(--line); }
  /* --tint is set by the Colorize toggle; otherwise the hover tint is the theme's grey */
  .card stop[stop-color="#353232"] { stop-color: color-mix(in srgb, var(--tint, var(--inner-hot)) calc(var(--hot, 0) * 100%), var(--inner)); }
  .card [stroke="#686565"] { stroke: color-mix(in srgb, var(--conn-hot) calc(var(--hot, 0) * 100%), var(--conn)); }
  /* Follow pointer: highlights are revealed around the pointer instead of per shape. Inner edges
     take a per-stop amount (--fhot); outlines are painted with a radial gradient centred on the
     pointer (--spot, one per layer) that blends the tint into the line colour. */
  :root.follow .card stop[stop-color="#353232"] { stop-color: color-mix(in srgb, var(--tint, var(--inner-hot)) calc(var(--fhot, 0) * 100%), var(--inner)); }
  :root.follow .card [stroke="#FDFCFC"] { stroke: var(--spot, var(--line)); }
  .card .spot stop { stop-color: color-mix(in srgb, var(--otint, var(--line)) calc(var(--pres, 0) * var(--w) * 100%), var(--line)); }
  /* stroke and stop colors are driven every frame by the hover/loop motion (--hot), so they get
     no CSS transition: one would lag the highlight behind the movement */
  .card path, .card rect { transition: fill .3s; }
  /* solid 1px hairlines at any card size: no sub-pixel strokes breaking into dots */
  .card svg [stroke] { vector-effect: non-scaling-stroke; }

  /* Each Figma group becomes its own layer: a backdrop-blur pane clipped to the group's
     silhouette (Figma's background blur), with the group's SVG drawn on top of it.
     --u is one Figma pixel at the current card size. */
  .card { container-type: inline-size; --u: calc(100cqw / 1080); }
  .card svg.src, .card svg.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .layer, .layer > svg, .layer > .blur, .card svg.hits-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .layer { pointer-events: none; }
  .layer > .blur {
    /* fixed px at every card size; set from the Blur control (default 5px) */
    -webkit-backdrop-filter: blur(var(--blur, 5px));
    backdrop-filter: blur(var(--blur, 5px));
    /* shaped with a mask, not clip-path: Chrome clips a blurred backdrop only to the
       clip-path's bounding box, which leaks glow outside the shape */
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  }
  /* The pane paints the layer's 50% fill itself, as in Figma (blur + fill on one layer).
     Chrome skips backdrop-filter on an element that paints nothing, so this is required. */
  .layer > .blur.filled { background: color-mix(in srgb, var(--fill) var(--fill-a, 50%), transparent); }

  /* per-layer hover: every value comes from the controls */
  .hit { fill: transparent; stroke: none; pointer-events: all; }

  /* curve presets */
  .curves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 4px; }
  .curve {
    display: grid; gap: 4px; justify-items: center; padding: 8px 4px 6px; cursor: pointer;
    background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font: 11px/1 inherit;
  }
  .curve svg { width: 100%; height: 34px; overflow: visible; }
  .curve path { stroke: currentColor; fill: none; stroke-width: 1.5; }
  .curve[aria-pressed="true"] { background: var(--control); color: var(--text); border-color: var(--muted); }

  /* controls */
  aside {
    border-left: 1px solid var(--border); background: var(--panel);
    height: 100vh; position: sticky; top: 0; overflow-y: auto; padding: 18px 18px 40px;
    transition: background-color .3s, border-color .3s;
  }
  aside h2 {
    font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 28px 0 12px;
  }
  aside h2:first-child { margin-top: 4px; }
  aside p { color: var(--muted); margin: -4px 0 10px; font-size: 12px; }
  .row { display: grid; grid-template-columns: 78px 1fr 48px; align-items: center; gap: 10px; margin: 10px 0; }
  .row label { color: var(--muted); }
  .row output {
    font: 12px var(--mono); text-align: right; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--control); color: var(--text); }
  .btn {
    background: var(--control); color: var(--text); border: 1px solid var(--border); border-radius: 4px;
    padding: 6px 10px; font: inherit; cursor: pointer;
  }
  /* per-card parameters: a collapsed dropdown in the card's bottom-left corner that opens upward */
  .tune {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 300; max-height: calc(100% - 44px);
    display: flex; flex-direction: column-reverse; align-items: flex-start; pointer-events: none;
  }
  .tune > summary {
    pointer-events: auto; cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); font-size: 12px;
    background: color-mix(in srgb, var(--panel) 80%, transparent);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: color .2s, border-color .2s;
  }
  .tune > summary::-webkit-details-marker { display: none; }
  .tune > summary::after {
    content: ""; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: translateY(1px) rotate(-135deg); transition: transform .2s;
  }
  .tune[open] > summary::after { transform: translateY(-2px) rotate(45deg); }
  .tune > summary:hover, .tune[open] > summary { color: var(--text); border-color: var(--muted); }
  .tune-body {
    pointer-events: auto; width: min(100%, 300px); margin-bottom: 6px; overflow-y: auto; min-height: 0;
    padding: 4px 12px 8px; border: 1px solid var(--border); border-radius: 4px;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .tune-body p { color: var(--muted); margin: 8px 0 2px; font-size: 12px; text-wrap: pretty; }
  .tune-body .row { grid-template-columns: 64px 1fr 44px; gap: 8px; margin: 8px 0; }
  .tune-body .check { margin: 8px 0; }
  .tune-body .link { background: none; border: 0; padding: 0; margin: 4px 0 2px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .tune-body .link:hover { color: var(--text); }

  .actions { display: flex; gap: 8px; margin-top: 28px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--muted); margin: 10px 0; cursor: pointer; }
  .toast { color: var(--muted); font-size: 12px; min-height: 18px; margin-top: 8px; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-left: 0; border-top: 1px solid var(--border); }
    main { padding: 16px; }
  }
  /* narrow screens cap the per-row choice so cards stay usable */
  @media (max-width: 900px) { .grid[data-cols="3"], .grid[data-cols="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 560px) { .grid, .grid[data-cols] { grid-template-columns: 1fr; } }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy-fallback { width: 100%; height: 160px; margin-top: 8px; font: 11px var(--mono);
    background: var(--control); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
</style>
<div class="app">
  <main>
    <header>
      <h1>Taktile illustrations <span>· hover to play</span></h1>
      <div class="controls">
        <span class="label" id="cols-label">Per row</span>
        <div class="seg" id="cols" role="group" aria-labelledby="cols-label">
          <button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button>
        </div>
        <div class="seg" id="theme" role="group" aria-label="Theme">
          <button data-v="dark">Dark</button><button data-v="light">Light</button><button data-v="system">System</button>
        </div>
      </div>
    </header>
    <div class="grid">
      <div class="card" id="card-cubes"><div class="tag">01 · Cubes lift</div>
        <svg class="src" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">{{CUBES}}</svg></div>
      <div class="card" id="card-stack"><div class="tag">02 · Stack rises</div>
        <svg class="src" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">{{STACK}}</svg></div>
      <div class="card" id="card-hole"><div class="tag">03 · Cube into hole (loop)</div>
        <svg class="src" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">{{HOLE}}</svg></div>
      <div class="card" id="card-slices"><div class="tag">04 · Slices slide right</div>
        <svg class="src" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">{{SLICES}}</svg></div>
      <div class="card" id="card-scale"><div class="tag">05 · Cube scale (loop)</div></div>
      <div class="card" id="card-orbit"><div class="tag">06 · Satellites lift</div>
        <svg class="src" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">{{ORBIT}}</svg></div>
      <div class="card" id="card-grow"><div class="tag">07 · Cubes grow</div>
        <svg class="src" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">{{GROW}}</svg></div>
      <div class="card" id="card-depth"><div class="tag">08 · Depth hand-off (loop)</div></div>
    </div>

  </main>
  <aside id="panel" aria-label="Animation controls"></aside>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const $ = s => document.querySelector(s);
  const clamp01 = v => Math.min(1, Math.max(0, v));

  // ---------- config ----------
  const BASE_LOOP_MS = 2400;   // one cube, spawn → gone, at speed 1×
  // Hover feel, as springs: response = how long a move takes (s). A spring keeps its velocity
  // when the target changes mid-move, so a moving cursor never makes a layer stop and restart.
  // How much it overshoots comes from the shared Bounce control, not the preset.
  const CURVES = {
    glide:  { label: 'Glide',  response: 0.4 },
    butter: { label: 'Butter', response: 0.55 },
    silk:   { label: 'Silk',   response: 0.75 },
    float:  { label: 'Float',  response: 0.95 },
    soft:   { label: 'Soft',   response: 1.1 },
    drift:  { label: 'Drift',  response: 1.3 },
  };
  const INFLUENCE_RADIUS = 360;   // Figma px of reach at 100% influence
  const DEFAULTS = {
    // shared by every animation on the page (the side panel)
    motion: { speed: 1, curve: 'butter', bounce: 0, fade: 0.6, smoothing: 350 },
    look:   { blur: 5, colorize: false, outline: false, follow: false, spotR: 300, spotSoft: 1 },
    // each card's own parameters (its Customize parameters dropdown)
    cubes:  { strength: 14, influence: 0.45, spin: 90 },
    stack:  { strength: 14, influence: 0.45, spin: 90 },
    slices: { strength: 14, influence: 0.45, spin: 90 },
    orbit:  { strength: 14, influence: 0.45, spin: 90 },
    scale:  { spin: 180, entry: 200, flip: false },
    grow:   { size: 0.5, push: 40, reach: 480, spin: 90 },
    depth:  { size: 130, hold: 0.3 },
    layout: { cols: 2 },
    preview: false,
  };
  const KEY = 'taktile-motion-external-v1';
  const clone = o => JSON.parse(JSON.stringify(o));
  const SAVED = ['motion', 'look', 'layout', 'cubes', 'stack', 'slices', 'orbit', 'scale', 'grow', 'depth'];
  let cfg = clone(DEFAULTS);
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) for (const k of SAVED) Object.assign(cfg[k], s[k]);
    if (!CURVES[cfg.motion.curve]) cfg.motion.curve = DEFAULTS.motion.curve;
  } catch {}
  // shared motion helpers
  const damping = () => 1 - 0.7 * cfg.motion.bounce;               // spring damping from Bounce
  const smooth = t => { t = Math.min(1, Math.max(0, t)); return t * t * t * (t * (t * 6 - 15) + 10); };
  // eased 0→1 for timed moves: smootherstep, plus an overshoot bump that grows with Bounce and
  // still lands at exactly 1 with no velocity
  const ease = t => { t = Math.min(1, Math.max(0, t)); return smooth(t) + cfg.motion.bounce * 9 * t * t * t * (1 - t) * (1 - t); };
  // ramp a loop's play speed toward 1 (hovered) or 0 using the shared Start/stop time
  const ramp = (v, on, dt) => {
    const target = on ? 1 : 0, r = cfg.motion.smoothing;
    v = r <= 0 ? target : v + (target - v) * (1 - Math.exp(-dt / (r / 3)));
    return target === 0 && v < 0.001 ? 0 : v;
  };
  // Return to rest (always on): once the pointer leaves, a loop always plays on (never backwards) to the
  // end of the cycle it is in and comes to rest there. It keeps the speed it had and eases out
  // to a stop on a cubic Hermite curve, which never overshoots, so it never moves backwards.
  const RETURN_SLOW = 1.5;   // the glide takes 1.5× as long as the rest of the cycle at full speed
  function startGlide(x, v, vn) {   // x: loop position, v: its speed now, vn: full speed (per ms)
    const to = Math.ceil(x - 1e-9), D = to - x;
    const T = Math.max(300, RETURN_SLOW * D / vn);
    return { from: x, D, T, k: D > 1e-9 ? Math.min(3, v * T / D) : 0, e: 0, x, done: D <= 1e-9 };
  }
  function glide(st, dt) {
    st.e += dt;
    const s = Math.min(1, st.e / st.T), s2 = s * s, s3 = s2 * s;
    st.x = st.from + st.D * (st.k * (s - 2 * s2 + s3) + 3 * s2 - 2 * s3);
    if (s >= 1) { st.x = st.from + st.D; st.done = true; }
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(Object.fromEntries(SAVED.map(k => [k, cfg[k]])))); } catch {} };

  // ---------- layers with background blur ----------
  // Every layer gets the same 5px background blur (see .layer > .blur).

  // outline path (M/L/H/V/Z only, as exported) → points
  function points(d) {
    const t = d.match(/[MLHVZ]|-?\d*\.?\d+(?:e-?\d+)?/gi), pts = [];
    let x = 0, y = 0, i = 0, cmd = 'M';
    while (i < t.length) {
      if (/[A-Z]/i.test(t[i])) cmd = t[i++].toUpperCase();
      if (cmd === 'Z') continue;
      if (cmd === 'H') x = +t[i++];
      else if (cmd === 'V') y = +t[i++];
      else { x = +t[i++]; y = +t[i++]; }
      pts.push([x, y]);
    }
    return pts;
  }
  const maskOf = pts => `url("data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 1080' preserveAspectRatio='none'><polygon points='${
      pts.map(([x, y]) => x.toFixed(2) + ',' + y.toFixed(2)).join(' ')}'/></svg>`)}")`;
  const setMask = (el, pts) => { el.style.webkitMaskImage = el.style.maskImage = maskOf(pts); };

  // Split a card's exported SVG into one positioned layer per top-level group, in paint order.
  const layerOf = {};
  function explode(card) {
    const src = card.querySelector('svg.src');
    const defs = document.createElementNS(NS, 'svg');
    defs.setAttribute('class', 'defs'); defs.setAttribute('aria-hidden', 'true');
    defs.appendChild(src.querySelector('defs'));
    card.appendChild(defs);
    for (const g of [...src.children].filter(n => n.tagName === 'g')) {
      const layer = document.createElement('div');
      layer.className = 'layer';
      layer.blur = null;   // shadows the element's own blur() method until a pane is attached
      // only shapes with a translucent fill get a blur pane (lines and open outlines don't)
      const outline = g.querySelector('path'), a = outline.getAttribute('fill-opacity');
      if (a) {
        const blur = document.createElement('div');
        blur.className = 'blur filled';
        setMask(blur, points(outline.getAttribute('d')));
        // move the outline's translucent fill onto the blur pane so it isn't painted twice
        blur.style.setProperty('--fill-a', Math.round(a * 100) + '%');
        outline.setAttribute('fill', 'none');
        layer.appendChild(blur);
        layer.blur = blur;
      }
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 1080 1080'); svg.setAttribute('fill', 'none'); svg.setAttribute('aria-hidden', 'true');
      svg.appendChild(g);
      layer.appendChild(svg);
      layer.svg = svg;
      card.appendChild(layer);
      layerOf[g.id] = layer;
    }
    src.remove();
    const hits = document.createElementNS(NS, 'svg');
    hits.setAttribute('class', 'hits-svg'); hits.setAttribute('viewBox', '0 0 1080 1080');
    card.appendChild(hits);
  }

  // 03 needs a second cube for the conveyor: clone it into the source before splitting.
  const holeSrc = $('#hole-cube');
  const holeNext = holeSrc.cloneNode(true);
  holeNext.querySelectorAll('[id]').forEach(e => e.removeAttribute('id'));
  holeNext.id = 'hole-cube-next';
  holeNext.querySelectorAll('[stroke^="url(#"]').forEach(el => {
    const g = document.getElementById(el.getAttribute('stroke').slice(5, -1)), copy = g.cloneNode(true);
    copy.id = g.id + '-next'; g.after(copy);
    el.setAttribute('stroke', `url(#${copy.id})`);
  });
  holeSrc.parentNode.insertBefore(holeNext, holeSrc);

  ['#card-cubes', '#card-stack', '#card-hole', '#card-slices', '#card-orbit', '#card-grow'].forEach(s => explode($(s)));

  // ---------- per-layer hover (01, 02, 04) ----------
  // Every moving layer follows its own spring. Its target is how "hovered" it is: the layer
  // under the cursor gets 1; with influence > 0, every other layer also gets a share that
  // fades smoothly with the cursor's distance from its centre.
  const HOVER = [
    { card: '#card-cubes',  key: 'cubes', dir: 'up', spin: true, order: ['cubes-cube-1', 'cubes-base', 'cubes-cube-2', 'cubes-cube-3'] },
    // 02 and 04 can also turn a quarter on hover (toggles): 02 to the right like 01's cubes;
    // 04 is 02's drawing turned 90° on screen, so the same turn there reads as upward
    { card: '#card-stack',  key: 'stack', dir: 'up', moveBase: true, spinBox: true, order: ['stack-base', 'stack-layer-1', 'stack-layer-2', 'stack-layer-3', 'stack-layer-4', 'stack-layer-5'] },
    { card: '#card-slices', key: 'slices', dir: 'right', moveBase: true, spinBox: true, screenRot: true, spinSign: -1, order: ['slices-base', 'slices-layer-2', 'slices-layer-3', 'slices-layer-4'] },
    // 06: the big cube stays put (and blocks what's behind it); each small cube owns the
    // dashed connector that ties it to the big cube
    { card: '#card-orbit',  key: 'orbit', dir: 'up', spin: true, fixed: ['orbit-big-cube'],
      order: ['orbit-cube', 'orbit-cube-3', 'orbit-big-cube', 'orbit-cube-5', 'orbit-cube-6', 'orbit-cube-7', 'orbit-cube-9'],
      conn: { 'orbit-cube': 5881, 'orbit-cube-3': 5889, 'orbit-cube-5': 5885, 'orbit-cube-6': 5886, 'orbit-cube-7': 5888, 'orbit-cube-9': 5890 } },
  ].map(h => ({ ...h, card: $(h.card), p: null, hit: null, u: 1 }));
  // bases stay put (they block what's behind them), except where a card lets its base move too
  const isFixed = (h, id) => (id.endsWith('-base') && !h.moveBase) || (h.fixed || []).includes(id);
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
  // gradient stops used by a layer's inner edges (they live in the card's shared defs)
  const stopsOf = layer => [...layer.svg.querySelectorAll('[stroke^="url(#"]')]
    .map(el => document.getElementById(el.getAttribute('stroke').slice(5, -1)))
    .filter(Boolean).flatMap(g => [...g.querySelectorAll('stop')]);

  // Spinning cubes (01, 06): while a cube turns it is drawn from real 3D geometry; once it lands
  // on a multiple of 90° it looks exactly like the Figma drawing, so the original paths come back.
  const SPIN_AX = (() => { const c = Math.cos(Math.PI / 6), r = Math.SQRT1_2; return [[c, 0.5, r], [0, -1, r], [-c, 0.5, r]]; })();
  const SPIN_EDGES = [];
  for (let i = 0; i < 8; i++) for (let a = 0; a < 3; a++) if (!(i >> a & 1)) SPIN_EDGES.push([i, i | 1 << a, a]);
  function cubeGeom(cx, cy, s, ang) {   // iso cube of edge s centred on (cx, cy), turned ang to the right
    const cs = Math.cos(ang), sn = Math.sin(ang);
    const view = ([X, Y, Z]) => {
      const Xr = X * cs + Z * sn, Zr = -X * sn + Z * cs;
      return [0, 1, 2].map(k => s * (Xr * SPIN_AX[0][k] + Y * SPIN_AX[1][k] + Zr * SPIN_AX[2][k]));
    };
    const P = [...Array(8)].map((_, i) => view([i & 1, i >> 1 & 1, i >> 2 & 1].map(v => v ? 0.5 : -0.5)));
    const S = P.map(([x, y]) => [cx + x, cy + y]);
    const faceZ = (b, sign) => { const n = [0, 0, 0]; n[b] = sign ? 1 : -1; return view(n)[2]; };
    const inner = SPIN_EDGES.filter(([i, , a]) => [0, 1, 2].filter(b => b !== a).every(b => faceZ(b, i >> b & 1) > 1e-4))
      .map(([i, j]) => P[i][2] >= P[j][2] ? [S[i], S[j]] : [S[j], S[i]]);   // from the nearer end
    return { hull: hull(S), inner };
  }
  function spinRig(layer) {
    const paths = [...layer.svg.querySelectorAll('path')];
    const outline = paths[0], lines = paths.filter(p => (p.getAttribute('stroke') || '').startsWith('url(#'));
    const grads = lines.map(p => document.getElementById(p.getAttribute('stroke').slice(5, -1)));
    const pts = points(outline.getAttribute('d')), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const w = Math.max(...xs) - Math.min(...xs);
    return {
      outline, lines, grads, pts,
      cx: (Math.max(...xs) + Math.min(...xs)) / 2, cy: (Math.max(...ys) + Math.min(...ys)) / 2,
      s: w / (2 * Math.cos(Math.PI / 6)),
      orig: { outline: outline.getAttribute('d'), lines: lines.map(l => l.getAttribute('d')),
        grads: grads.map(g => ['x1', 'y1', 'x2', 'y2'].map(k => g.getAttribute(k))) },
      a: 0, av: 0, target: 0, live: false,
      draw(blur) { drawSpin(this, blur); }, restore(blur) { restoreSpin(this, blur); },
    };
  }

  // Spinning boxes (02 slabs, 04 slices): any square box (edge s, height h) turning on its own
  // axis. 04 is drawn a quarter turn round on screen, so it is worked out upright and turned
  // back (local down = screen left). While it turns, an overlay draws all 12 edges, each fading
  // with its two faces (as in 05) so nothing pops; at every quarter turn the Figma paths return.
  let boxRigs = 0;
  // hold: slabs' Figma edges hold full strength for their near half; cubes' fade all the way
  function boxRig(layer, screenRot, hold = true) {
    const paths = [...layer.svg.querySelectorAll('path')];
    const outline = paths[0], inner = paths.filter(p => (p.getAttribute('stroke') || '').startsWith('url(#'));
    const pts = points(outline.getAttribute('d')), xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2;
    const W = Math.max(...xs) - Math.min(...xs), H = Math.max(...ys) - Math.min(...ys);
    const [wl, hl] = screenRot ? [H, W] : [W, H];
    const s = wl / (2 * Math.cos(Math.PI / 6)), h = hl - s;   // iso: top face is s tall on screen
    const toScreen = screenRot ? ([x, y]) => [cx - y, cy + x] : ([x, y]) => [cx + x, cy + y];
    const id = 'bx' + ++boxRigs;
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('visibility', 'hidden');
    g.innerHTML = `<defs>${SPIN_EDGES.map((_, k) => `<linearGradient id="${id}g${k}" gradientUnits="userSpaceOnUse">
        <stop stop-color="#353232"/><stop offset="0.5" stop-color="#353232"/><stop offset="1" stop-color="#353232"/></linearGradient>`).join('')}</defs>
      ${SPIN_EDGES.map((_, k) => `<line stroke="url(#${id}g${k})"/>`).join('')}`;
    outline.after(g);
    const lines = [...g.querySelectorAll('line')], grads = [...g.querySelectorAll('linearGradient')];
    const stops = grads.map(gr => [...gr.querySelectorAll('stop')]);
    const orig = outline.getAttribute('d'), REST = SPIN_AX[0][2], f = n => n.toFixed(2);
    return {
      a: 0, av: 0, target: 0, live: false,
      draw(blur) {
        const cs = Math.cos(this.a), sn = Math.sin(this.a);
        const view = ([X, Y, Z]) => { const Xr = X * cs + Z * sn, Zr = -X * sn + Z * cs;
          return [0, 1, 2].map(k => Xr * SPIN_AX[0][k] + Y * SPIN_AX[1][k] + Zr * SPIN_AX[2][k]); };
        const half = [s / 2, h / 2, s / 2];
        const P = [...Array(8)].map((_, i) => view([0, 1, 2].map(b => (i >> b & 1 ? 1 : -1) * half[b])));
        const S = P.map(toScreen);
        const faceZ = (b, sign) => { const n = [0, 0, 0]; n[b] = sign ? 1 : -1; return view(n)[2]; };
        lines.forEach((ln, k) => {
          const [i, j, a] = SPIN_EDGES[k];
          const w = smooth(Math.min(...[0, 1, 2].filter(b => b !== a).map(b => faceZ(b, i >> b & 1))) / (0.6 * REST));
          if (w <= 0.001) { ln.setAttribute('visibility', 'hidden'); return; }
          ln.removeAttribute('visibility');
          ln.setAttribute('stroke-opacity', w.toFixed(3));
          // Figma: the height edge fades from its near end; on slabs the other edges hold full
          // strength for their near half, then fade out
          const near = clamp01((1 + (P[i][2] - P[j][2]) / (REST * half[a] * 2)) / 2);
          const st = stops[k];
          st[0].setAttribute('stop-opacity', near.toFixed(3));
          st[1].setAttribute('stop-opacity', a === 1 || !hold ? '0.5' : '1');
          st[2].setAttribute('stop-opacity', (1 - near).toFixed(3));
          for (const el of [ln, grads[k]]) {
            el.setAttribute('x1', f(S[i][0])); el.setAttribute('y1', f(S[i][1]));
            el.setAttribute('x2', f(S[j][0])); el.setAttribute('y2', f(S[j][1]));
          }
        });
        const hl2 = hull(S);
        outline.setAttribute('d', 'M' + hl2.map(([x, y]) => `${f(x)} ${f(y)}`).join('L') + 'Z');
        inner.forEach(p => p.setAttribute('visibility', 'hidden'));
        g.removeAttribute('visibility');
        if (blur) setMask(blur, hl2);
      },
      restore(blur) {   // back to the exact Figma paths
        outline.setAttribute('d', orig);
        inner.forEach(p => p.removeAttribute('visibility'));
        g.setAttribute('visibility', 'hidden');
        if (blur) setMask(blur, pts);
      },
    };
  }
  function drawSpin(r, blur) {
    const f = n => n.toFixed(2), g = cubeGeom(r.cx, r.cy, r.s, r.a);
    r.outline.setAttribute('d', 'M' + g.hull.map(([x, y]) => `${f(x)} ${f(y)}`).join('L') + 'Z');
    r.lines.forEach((ln, k) => {
      const e = g.inner[k];
      ln.setAttribute('d', e ? `M${f(e[0][0])} ${f(e[0][1])}L${f(e[1][0])} ${f(e[1][1])}` : '');
      if (e) [e[0][0], e[0][1], e[1][0], e[1][1]].forEach((v, i) => r.grads[k].setAttribute(['x1', 'y1', 'x2', 'y2'][i], f(v)));
    });
    if (blur) setMask(blur, g.hull);
  }
  function restoreSpin(r, blur) {   // back to the exact Figma paths
    r.outline.setAttribute('d', r.orig.outline);
    r.lines.forEach((ln, k) => ln.setAttribute('d', r.orig.lines[k]));
    r.grads.forEach((g, k) => ['x1', 'y1', 'x2', 'y2'].forEach((a, i) => g.setAttribute(a, r.orig.grads[k][i])));
    if (blur) setMask(blur, r.pts);
  }

  for (const h of HOVER) {
    // fixed layers (bases, 06's big cube) never move, but get the same stroke tint on hover
    h.springs = h.order.map(id => {
      const layer = layerOf[id], pts = points(layer.svg.querySelector('path').getAttribute('d'));
      const c = pts.reduce((a, [x, y]) => [a[0] + x / pts.length, a[1] + y / pts.length], [0, 0]);
      // 06: each small cube's dashed connector lifts and tints along with it
      const connLayer = h.conn && h.conn[id] ? layerOf[`orbit-conn-${h.conn[id]}`] : null;
      const conn = connLayer ? [...connLayer.svg.querySelectorAll('[stroke="#686565"]')] : [];
      const fixed = isFixed(h, id);
      const spin = fixed ? null : h.spin ? spinRig(layer) : h.spinBox ? boxRig(layer, h.screenRot) : null;
      return { id, layer, c, fixed, x: 0, v: 0, drawn: null, hot: null, oh: 0, ohDrawn: null, tint: [...stopsOf(layer), ...conn],
        moved: connLayer ? [layer, connLayer] : [layer], spin };
    });
    h.byId = Object.fromEntries(h.springs.map(sp => [sp.id, sp]));
    const card = h.card, toFig = e => {
      const r = card.getBoundingClientRect();
      return [(e.clientX - r.left) / r.width * 1080, (e.clientY - r.top) / r.height * 1080];
    };
    card.addEventListener('pointermove', e => { h.p = toFig(e); });
    card.addEventListener('pointerenter', e => { h.p = toFig(e); });
    card.addEventListener('pointerleave', () => { h.p = null; h.hit = null; });
    new ResizeObserver(() => { h.u = card.clientWidth / 1080; }).observe(card);
  }

  // Hit areas sit on top in the art's paint order and never move: each covers the layer's
  // rest position plus its fully hovered one, so a layer can't slide out from under the
  // cursor. Base gets one too, so it blocks whatever is behind it.
  function buildHits() {
    for (const h of HOVER) {
      const hits = h.card.querySelector('.hits-svg');
      hits.innerHTML = '';
      const { strength } = cfg[h.key];
      const [dx, dy] = h.dir === 'right' ? [strength, 0] : [0, -strength];
      for (const id of h.order) {
        const d = layerOf[id].svg.querySelector('path').getAttribute('d');
        const g = document.createElementNS(NS, 'g');
        g.innerHTML = isFixed(h, id) ? `<path class="hit" d="${d}"/>`
          : `<path class="hit" d="${d}"/><path class="hit" d="${d}" transform="translate(${dx} ${dy})"/>`;
        g.addEventListener('pointerenter', () => {
          h.hit = id;
          // each hover turns this cube one more step to the right
          const r = h.byId[id] && h.byId[id].spin;
          const deg = cfg[h.key].spin;
          if (r && deg) r.target += (h.spinSign || 1) * deg * Math.PI / 180;
        });
        g.addEventListener('pointerleave', () => { if (h.hit === id) h.hit = null; });
        hits.appendChild(g);
      }
    }
  }

  const falloff = t => t >= 1 ? 0 : 1 - t * t * (3 - 2 * t);
  const inPoly = ([x, y], P) => {   // even-odd point-in-polygon
    let inside = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const [xi, yi] = P[i], [xj, yj] = P[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  };
  // Hover tint per shape on the loops (03, 05): parts in top-to-bottom paint order; only the
  // topmost part under the pointer lights up (inner edges and outline), easing in and out
  function stepPartTint(parts, p, dt) {
    const tau = CURVES[cfg.motion.curve].response / cfg.motion.speed / 4 * 1000;
    let taken = false;
    for (const part of parts) {
      const on = cfg.preview || (!!p && !taken && part.over(p));
      taken = taken || on;
      const target = on ? 1 : 0;
      part.x = reduceMotion.matches ? target : part.x + (target - part.x) * (1 - Math.exp(-dt / tau));
      if (Math.abs(target - part.x) < 0.002) part.x = target;
      const v = part.x.toFixed(3);
      if (part.drawn !== v) {
        part.tint.forEach(el => el.style.setProperty('--hot', v));
        part.layers.forEach(l => l.style.setProperty('--ohot', v));
        part.drawn = v;
      }
    }
  }
  // outline tint: eases toward 1 on the shape under the cursor only (no Influence spread)
  function outlineTint(o, on, el, dt) {
    const target = on ? 1 : 0, tau = CURVES[cfg.motion.curve].response / cfg.motion.speed / 4 * 1000;
    o.oh = reduceMotion.matches ? target : o.oh + (target - o.oh) * (1 - Math.exp(-dt / tau));
    if (Math.abs(target - o.oh) < 0.002) o.oh = target;
    const v = o.oh.toFixed(3);
    if (o.ohDrawn !== v) { el.style.setProperty('--ohot', v); o.ohDrawn = v; }
  }   // smoothstep: 1 at the centre → 0 at the edge

  function stepHover(dt) {
    const { response } = CURVES[cfg.motion.curve];
    const w = 2 * Math.PI * cfg.motion.speed / response, k = w * w, c = 2 * damping() * w;
    for (const h of HOVER) {
      const { strength, influence } = cfg[h.key], R = influence * INFLUENCE_RADIUS;
      for (const sp of h.springs) {
        let amt = 0;
        if (cfg.preview) amt = 1;
        else if (h.p) {
          amt = h.hit === sp.id ? 1 : 0;
          if (R > 0) amt = Math.max(amt, falloff(Math.hypot(h.p[0] - sp.c[0], h.p[1] - sp.c[1]) / R));
        }
        // the spring runs on the hover amount (0..1); Strength only scales the distance
        const target = amt;
        if (reduceMotion.matches) { sp.x = target; sp.v = 0; }
        else if (Math.abs(target - sp.x) > 0.0004 || Math.abs(sp.v) > 0.0004) {
          const n = Math.max(1, Math.ceil(dt / 4)), hs = dt / 1000 / n;   // 4ms substeps keep stiff springs stable
          for (let i = 0; i < n; i++) { sp.v += (k * (target - sp.x) - c * sp.v) * hs; sp.x += sp.v * hs; }
        } else { sp.x = target; sp.v = 0; }
        const px = (sp.x * strength * h.u).toFixed(2);
        if (!sp.fixed && sp.drawn !== px) {
          const tf = h.dir === 'right' ? `translate3d(${px}px,0,0)` : `translate3d(0,${-px}px,0)`;
          const off = h.dir === 'right' ? [sp.x * strength, 0] : [0, -sp.x * strength];
          sp.moved.forEach(el => { el.style.transform = tf; el._off = off; });
          sp.drawn = px;
        }
        // hover tint: this layer's inner edges (and its connector, if it has one), on the same
        // spring as the movement so both land together
        const hot = clamp01(sp.x).toFixed(3);
        if (sp.hot !== hot) { sp.tint.forEach(el => el.style.setProperty('--hot', hot)); sp.hot = hot; }
        outlineTint(sp, cfg.preview || (h.p && h.hit === sp.id), sp.layer, dt);
        // spin on the same spring settings as the lift
        const r = sp.spin;
        if (r && (r.live || r.a !== r.target)) {
          if (reduceMotion.matches) { r.a = r.target; r.av = 0; }
          else {
            const n = Math.max(1, Math.ceil(dt / 4)), hs = dt / 1000 / n;
            for (let i = 0; i < n; i++) { r.av += (k * (r.target - r.a) - c * r.av) * hs; r.a += r.av * hs; }
          }
          if (Math.abs(r.target - r.a) < 1e-4 && Math.abs(r.av) < 1e-4) {
            r.a = r.target; r.av = 0; r.live = false;
            const quarter = Math.PI / 2, m = r.a / quarter;
            if (Math.abs(m - Math.round(m)) < 1e-6) r.restore(sp.layer.blur); else r.draw(sp.layer.blur);
          } else { r.live = true; r.draw(sp.layer.blur); }
        }
      }
    }
  }

  function applyHover() { buildHits(); }

  // ---------- 07: cubes grow — the hovered cube grows, the others make room ----------
  // The cube under the cursor scales up by Size around its own centre; every other cube is
  // pushed straight away from it, Push px at the nearest and fading out by Reach. Each cube's
  // scale and offset ride the shared hover spring, so sliding across the grid flows.
  const growCard = $('#card-grow');
  let growHit = null;
  const growCubes = [...growCard.querySelectorAll(':scope > .layer')].map((layer, i) => {
    const outline = layer.svg.querySelector('path'), pts = points(outline.getAttribute('d'));
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const c = [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2];
    layer.style.transformOrigin = `${(c[0] / 10.8).toFixed(3)}% ${(c[1] / 10.8).toFixed(3)}%`;
    const spin = boxRig(layer, false, false);   // cubes turn to the right on hover, as in 01
    return { layer, c, i, d: outline.getAttribute('d'), tint: stopsOf(layer), spin,
      s: 0, sv: 0, x: 0, xv: 0, y: 0, yv: 0, drawn: null, hot: null, oh: 0, ohDrawn: null };
  });
  {   // hit areas at rest, in paint order, so the hovered cube never slides out from under the cursor
    const hits = growCard.querySelector('.hits-svg');
    for (const q of growCubes) {
      const el = document.createElementNS(NS, 'path');
      el.setAttribute('class', 'hit'); el.setAttribute('d', q.d);
      el.addEventListener('pointerenter', () => {
        growHit = q;
        if (cfg.grow.spin) q.spin.target += cfg.grow.spin * Math.PI / 180;   // one more turn per hover
      });
      el.addEventListener('pointerleave', () => { if (growHit === q) growHit = null; });
      hits.appendChild(el);
    }
    growCard.addEventListener('pointerleave', () => growHit = null);
  }
  function stepGrow(dt) {
    const { response } = CURVES[cfg.motion.curve];
    const w = 2 * Math.PI * cfg.motion.speed / response, k = w * w, c = 2 * damping() * w;
    const { size, push, reach } = cfg.grow;
    const hot = cfg.preview ? growCubes[4] : growHit;   // Hover everything: the middle cube
    const n = Math.max(1, Math.ceil(dt / 4)), hs = dt / 1000 / n;
    for (const q of growCubes) {
      let ts = 0, tx = 0, ty = 0;
      if (hot === q) ts = 1;
      else if (hot) {
        const dx = q.c[0] - hot.c[0], dy = q.c[1] - hot.c[1], d = Math.hypot(dx, dy) || 1;
        const f = reach > 0 ? falloff(d / reach) : 0;
        tx = dx / d * push * f; ty = dy / d * push * f;
      }
      if (reduceMotion.matches) { q.s = ts; q.x = tx; q.y = ty; q.sv = q.xv = q.yv = 0; }
      else for (let j = 0; j < n; j++) {
        q.sv += (k * (ts - q.s) - c * q.sv) * hs; q.s += q.sv * hs;
        q.xv += (k * (tx - q.x) - c * q.xv) * hs; q.x += q.xv * hs;
        q.yv += (k * (ty - q.y) - c * q.yv) * hs; q.y += q.yv * hs;
      }
      const tf = `translate3d(calc(${q.x.toFixed(2)} * var(--u)), calc(${q.y.toFixed(2)} * var(--u)), 0) scale(${(1 + q.s * size).toFixed(4)})`;
      if (q.drawn !== tf) {
        q.layer.style.transform = tf;
        Object.assign(q.layer, { _off: [q.x, q.y], _scale: 1 + q.s * size, _c: q.c });
        q.layer.style.zIndex = q.i + Math.round(Math.max(0, q.s) * 100);   // the growing cube draws on top
        q.drawn = tf;
      }
      const h = clamp01(q.s).toFixed(3);
      if (q.hot !== h) { q.tint.forEach(el => el.style.setProperty('--hot', h)); q.hot = h; }
      outlineTint(q, hot === q, q.layer, dt);
      // spin on the same spring; at every quarter turn the Figma paths come back
      const r = q.spin;
      if (r.live || r.a !== r.target) {
        if (reduceMotion.matches) { r.a = r.target; r.av = 0; }
        else for (let j = 0; j < n; j++) { r.av += (k * (r.target - r.a) - c * r.av) * hs; r.a += r.av * hs; }
        if (Math.abs(r.target - r.a) < 1e-4 && Math.abs(r.av) < 1e-4) {
          r.a = r.target; r.av = 0; r.live = false;
          const m = r.a / (Math.PI / 2);
          if (Math.abs(m - Math.round(m)) < 1e-6) r.restore(q.layer.blur); else r.draw(q.layer.blur);
        } else { r.live = true; r.draw(q.layer.blur); }
      }
    }
  }

  // ---------- 03: cube into hole — linear conveyor ----------
  // The small cube's back face has exactly the hole's shape, so it slides along the isometric
  // depth axis at constant speed; once its back face reaches the wall it's cut at the wall
  // plane, getting shallower until its front face sits in the hole and it's gone. A second
  // cube fades in behind it, one cube-length of travel back, so the loop has no seam or pause.
  const holeCard = $('#card-hole');
  const AX = { x: Math.cos(Math.PI / 6), y: -0.5 };  // into the big cube's left face
  const EDGE = 60.1;                                  // cube edge length on screen
  const CONTACT = 107.5;                              // travel until the back face meets the wall
  const TRAVEL = CONTACT + EDGE;                      // travel until the cube is fully inside
  // front (left) face corners at rest: top-left, top-right, bottom-right, bottom-left
  const F = [[300, 539.041], [352, 569.1], [352, 629.215], [300, 599.157]];

  const cubes = ['hole-cube', 'hole-cube-next'].map(id => {
    const layer = layerOf[id], g = layer.svg.querySelector('g'), paths = g.querySelectorAll('path');
    return { layer, g, outline: paths[0], depthLine: paths[1] };   // paths[1]: edge along the depth axis
  });

  function drawCube(c, s, opacity) {
    const depth = Math.min(EDGE, Math.max(0, TRAVEL - s));   // part still outside the wall
    const hidden = depth <= 0.01 || opacity <= 0.001;
    c.layer.style.visibility = hidden ? 'hidden' : '';
    c.poly = null;   // hover shape, in card coordinates (none while hidden or barely faded in)
    if (hidden) return;
    const vx = AX.x * depth, vy = AX.y * depth, ox = AX.x * s, oy = AX.y * s;
    const [A, B, C, D] = F;
    const hex = [A, D, C, [C[0] + vx, C[1] + vy], [B[0] + vx, B[1] + vy], [A[0] + vx, A[1] + vy]];
    const p = ([x, y]) => `${x.toFixed(3)} ${y.toFixed(3)}`;
    c.outline.setAttribute('d', 'M' + hex.map(p).join('L') + 'Z');
    c.depthLine.setAttribute('d', `M${p(hex[4])}L${p(B)}`);
    c.g.setAttribute('transform', `translate(${ox.toFixed(3)} ${oy.toFixed(3)})`);
    c.layer._off = [ox, oy];
    // the mask shape only changes while the cube is crossing the wall; otherwise just move it
    const key = depth.toFixed(2);
    if (c.maskKey !== key) { setMask(c.layer.blur, hex); c.maskKey = key; }
    c.layer.blur.style.webkitMaskPosition = c.layer.blur.style.maskPosition =
      `calc(${ox.toFixed(3)} * var(--u)) calc(${oy.toFixed(3)} * var(--u))`;
    // fade the pane and the drawing separately: opacity on their parent would cut the
    // blur off from what's behind it
    c.layer.blur.style.opacity = c.layer.svg.style.opacity = opacity.toFixed(3);
    if (opacity > 0.3) c.poly = hex.map(([x, y]) => [x + ox, y + oy]);
  }

  let u = 0, vel = 0, last = performance.now(), holeHover = false, holeRet = null;
  function renderHole() {
    const s = u * TRAVEL;
    drawCube(cubes[0], s, 1);                                         // current cube, heading in
    const sn = s - TRAVEL;                                            // next cube, one length behind
    drawCube(cubes[1], sn, clamp01(1 + sn / (cfg.motion.fade * TRAVEL)));
  }
  // Hover tint per shape: the small cubes (as one group) and the big cube each light up only
  // while the pointer is over them; the loop itself still plays whenever the card is hovered.
  let holeP = null;
  const holeFig = e => { const r = holeCard.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 1080, (e.clientY - r.top) / r.height * 1080]; };
  holeCard.addEventListener('pointerenter', e => { holeHover = true; holeP = holeFig(e); });
  holeCard.addEventListener('pointermove', e => { holeP = holeFig(e); });
  holeCard.addEventListener('pointerleave', () => { holeHover = false; holeP = null; });
  const holeBig = layerOf['hole-big-cube'];
  const holeBigPts = points(holeBig.svg.querySelector('path').getAttribute('d'));
  const holeParts = [
    { layers: cubes.map(c => c.layer), tint: cubes.flatMap(c => stopsOf(c.layer)), over: p => cubes.some(c => c.poly && inPoly(p, c.poly)) },
    { layers: [holeBig], tint: stopsOf(holeBig), over: p => inPoly(p, holeBigPts) },
  ].map(o => ({ ...o, x: 0, drawn: null }));
  // the small cubes paint over the big one, so they come first and win where they overlap
  const stepHoleTint = dt => stepPartTint(holeParts, holeP, dt);

  // ---------- 05: cube scale — vertical conveyor with a spin on the cube's own axis ----------
  // Four cubes ride five slots up the frame: spawn (fading in) → bottom → middle (big) →
  // top → exit (fading out). Each step every cube moves up one slot on one ease-in-out curve;
  // spawn and exit sit one slot-spacing past the ends, so the leaving cube keeps the others'
  // speed. It fades out in the first half of the move and the new cube fades in in the second,
  // so there are never more than three on screen. Once the one heading to
  // the middle has its final position and scale, it spins to the right on its own vertical
  // axis, in place. A cube turned a multiple of 90° on that axis looks exactly like it did,
  // so the loop has no seam. The cubes are drawn from true 3D geometry, not the Figma paths.
  const SCALE_LOOP_MS = 2600;   // one step of the conveyor at speed 1×
  const scaleCard = $('#card-scale');
  const C30 = Math.cos(Math.PI / 6), R2 = Math.SQRT1_2;
  // world axes (X, Y up, Z) in view space: x right, y down, z toward the viewer (isometric)
  const AXES = [[C30, 0.5, R2], [0, -1, R2], [-C30, 0.5, R2]];
  const EDGE_S = 60.04;                                   // small cube: 104 × 120 in Figma
  // corners in world space (X, Y up, Z), ±half an edge
  const CORNERS = [...Array(8)].map((_, i) => [i & 1, (i >> 1) & 1, (i >> 2) & 1].map(v => v ? 0.5 : -0.5));
  // turn a world point by `a` around the vertical axis (positive = front edge moves right),
  // then take it to view space
  const toView = ([X, Y, Z], cs, sn) => {
    const Xr = X * cs + Z * sn, Zr = -X * sn + Z * cs;
    return [0, 1, 2].map(k => EDGE_S * (Xr * AXES[0][k] + Y * AXES[1][k] + Zr * AXES[2][k]));
  };
  const EDGES = [];
  for (let i = 0; i < 8; i++) for (let a = 0; a < 3; a++) if (!(i >> a & 1)) EDGES.push([i, i | 1 << a, a]);
  const EDGE_FADE_Z = 0.6;   // an edge is fully drawn while both its faces turn at least this much toward the viewer (of rest)
  const SMALL = [1, 1], BIG = [346 / 104, 409.95 / 120.08];   // Figma: 104×120 small, 346×410 big
  const SLOTS = [
    { y: 884.1 + (884.1 - 539.97), s: SMALL },   // spawn: one spacing below the bottom
    { y: 884.1,  s: SMALL },                     // bottom
    { y: 539.97, s: BIG },                       // middle
    { y: 195.1,  s: SMALL },                     // top
    { y: 195.1 - (539.97 - 195.1), s: SMALL },   // exit: one spacing above the top
  ];
  const lerp = (a, b, t) => a + (b - a) * t;
  // ease-in-out: soft start and end, fastest at the midpoint, no overshoot
  const easeIO = t => (1 - Math.cos(Math.PI * clamp01(t))) / 2;

  function hull(pts) {   // monotone chain convex hull
    const p = [...pts].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const q of p) { while (lo.length > 1 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
    for (const q of p.reverse()) { while (up.length > 1 && cross(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }

  const scaleCubes = [0, 1, 2, 3].map(i => {
    const layer = document.createElement('div');
    layer.className = 'layer';
    const blur = document.createElement('div');
    blur.className = 'blur filled';
    blur.style.setProperty('--fill-a', '50%');
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 1080 1080'); svg.setAttribute('fill', 'none'); svg.setAttribute('aria-hidden', 'true');
    // one line per cube edge (12): while spinning, edges fade in and out instead of popping
    svg.innerHTML = `<defs>${EDGES.map((_, k) => `<linearGradient id="sc${i}g${k}" gradientUnits="userSpaceOnUse">
        <stop stop-color="#353232"/><stop offset="1" stop-color="#353232" stop-opacity="0"/></linearGradient>`).join('')}</defs>
      ${EDGES.map((_, k) => `<line stroke="url(#sc${i}g${k})"/>`).join('')}<path stroke="#FDFCFC"/>`;
    layer.append(blur, svg);
    scaleCard.appendChild(layer);
    const grads = [...svg.querySelectorAll('linearGradient')];
    return { layer, blur, svg, lines: [...svg.querySelectorAll('line')], grads,
      stops: grads.map(g => [...g.querySelectorAll('stop')]), outline: svg.querySelector('path'), maskKey: null };
  });

  function drawScaleCube(c, cx, cy, sx, sy, th, o) {
    c.poly = null;   // hover shape (none while hidden or barely faded in)
    if (o <= 0.001) { c.layer.style.visibility = 'hidden'; return; }
    c.layer.style.visibility = '';
    // spin on the cube's own vertical axis: side faces turn in and out of view
    const cs = Math.cos(th), sn = Math.sin(th);
    const P = CORNERS.map(w => toView(w, cs, sn));
    const S = P.map(([x, y]) => [cx + x * sx, cy + y * sy]);
    const faceZ = (b, sign) => { const n = [0, 0, 0]; n[b] = sign ? 1 : -1; return toView(n, cs, sn)[2]; };
    // inner edges: an edge shows as much as the less visible of its two faces faces the viewer,
    // so as a side face turns edge-on its edges fade out and the next face's fade in (no pop).
    // Along the edge the gradient runs from the nearer end; when both ends are equally near it
    // blends smoothly instead of flipping. At rest this is exactly the Figma drawing.
    const REST_Z = EDGE_S * R2, f = n => n.toFixed(2);
    c.lines.forEach((ln, k) => {
      const [i, j, a] = EDGES[k];
      const faces = [0, 1, 2].filter(b => b !== a).map(b => faceZ(b, i >> b & 1));
      const w = smooth(Math.min(...faces) / (EDGE_FADE_Z * REST_Z));
      if (w <= 0.001) { ln.setAttribute('visibility', 'hidden'); return; }
      ln.removeAttribute('visibility');
      ln.setAttribute('stroke-opacity', w.toFixed(3));
      const near = clamp01((1 + (P[i][2] - P[j][2]) / REST_Z) / 2);   // 1: i is the near end
      c.stops[k][0].setAttribute('stop-opacity', near.toFixed(3));
      c.stops[k][1].setAttribute('stop-opacity', (1 - near).toFixed(3));
      for (const el of [ln, c.grads[k]]) {
        el.setAttribute('x1', f(S[i][0])); el.setAttribute('y1', f(S[i][1]));
        el.setAttribute('x2', f(S[j][0])); el.setAttribute('y2', f(S[j][1]));
      }
    });
    const H = hull(S);
    c.outline.setAttribute('d', 'M' + H.map(([x, y]) => `${f(x)} ${f(y)}`).join('L') + 'Z');
    // blur pane: mask the silhouette inside its own box; only rebuild the image when the
    // shape changes (it only does while flipping), otherwise just move and resize it
    const xs = H.map(p => p[0]), ys = H.map(p => p[1]);
    const x0 = Math.min(...xs), y0 = Math.min(...ys), w = Math.max(...xs) - x0, h = Math.max(...ys) - y0;
    const norm = H.map(([x, y]) => [(x - x0) / w * 1000, (y - y0) / h * 1000]);
    const key = norm.map(([x, y]) => `${x.toFixed(0)},${y.toFixed(0)}`).join(' ');
    if (c.maskKey !== key) {
      const img = `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 1000' preserveAspectRatio='none'><polygon points='${key}'/></svg>`)}")`;
      c.blur.style.webkitMaskImage = c.blur.style.maskImage = img;
      c.maskKey = key;
    }
    c.blur.style.webkitMaskSize = c.blur.style.maskSize = `calc(${f(w)} * var(--u)) calc(${f(h)} * var(--u))`;
    c.blur.style.webkitMaskPosition = c.blur.style.maskPosition = `calc(${f(x0)} * var(--u)) calc(${f(y0)} * var(--u))`;
    c.blur.style.opacity = c.svg.style.opacity = o.toFixed(3);
    c.layer.style.zIndex = Math.round(sx * 10);   // the bigger cube draws on top
    c.z = sx;
    if (o > 0.3) c.poly = H;
  }

  let scP = 0, scVel = 0, scHover = false, scRet = null;
  // share of a step for: move, hold, spin (the rest is the hold after the spin)
  const SCALE_PHASES = [0.36, 0.09, 0.46];
  // cubes fade by distance to the frame edge too, so none is ever cut off by it: gone EDGE_PAD
  // px before the edge, fully visible EDGE_FADE px further in (both rest slots clear it)
  const EDGE_PAD = 15, EDGE_FADE = 100;
  const edgeFade = (y, sy) => {
    const h = EDGE_S * sy;   // half the cube's height on screen
    return smooth(Math.min(y - h - EDGE_PAD, 1080 - EDGE_PAD - (y + h)) / EDGE_FADE);
  };
  function renderScale() {
    const spin = (cfg.scale.spin || 0) * Math.PI / 180;
    const step = Math.floor(scP), f = scP - step;
    // one step: move + scale into place, a short hold, the spin, another short hold, then the
    // next step moves on. Without a spin the move takes the whole step.
    const [MOVE, HOLD, SPIN] = spin ? SCALE_PHASES : [1, 0, 0];
    const tm = clamp01(f / MOVE), move = easeIO(tm);
    const turn = spin ? easeIO((f - MOVE - HOLD) / SPIN) : 0;
    // the leaving cube is gone by the midpoint of the move and the new one only starts there;
    // shared Fades sets how much of each half the fade takes
    const fw = Math.max(0.01, cfg.motion.fade) * 0.5;
    const fadeOut = clamp01((0.5 - move) / fw);
    // the new cube arrives on its own ease-out over the second half: it enters already moving
    // fast from Entry px below and settles into the bottom slot with the others
    const pin = clamp01((tm - 0.5) / 0.5), fadeIn = clamp01(pin / (fw * 2));
    const entryY = SLOTS[1].y + (cfg.scale.entry || 0) * Math.pow(1 - pin, 3);
    scaleCubes.forEach((c, i) => {
      const base = ((i + step) % 4 + 4) % 4, slot = base + move;
      const k = Math.min(3, Math.floor(slot)), t = slot - k, A = SLOTS[k], B = SLOTS[k + 1];
      // spin depends only on the slot, so the loop can also run backwards (Return to rest):
      // a fresh cube starts at 0 (the page at rest matches the Figma frame), spins while it
      // heads to the middle, and keeps that turn until it leaves
      const th = base === 1 ? spin * turn : base >= 2 ? spin : 0;
      const y = base === 0 ? entryY : lerp(A.y, B.y, t);
      const sy = lerp(A.s[1], B.s[1], t);
      const o = base === 0 ? Math.min(fadeIn, edgeFade(y, sy)) : base === 3 ? Math.min(fadeOut, edgeFade(y, sy)) : 1;
      // Flip: the same conveyor laid on its side, cubes enter on the left and leave on the right
      if (cfg.scale.flip) drawScaleCube(c, 1080 - y, 540, lerp(A.s[0], B.s[0], t), sy, th, o);
      else drawScaleCube(c, 540, y, lerp(A.s[0], B.s[0], t), sy, th, o);
    });
  }
  // hover tint per cube: only the cube under the pointer lights up
  let scPt = null;
  const scFig = e => { const r = scaleCard.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 1080, (e.clientY - r.top) / r.height * 1080]; };
  scaleCard.addEventListener('pointerenter', e => { scHover = true; scPt = scFig(e); });
  scaleCard.addEventListener('pointermove', e => { scPt = scFig(e); });
  scaleCard.addEventListener('pointerleave', () => { scHover = false; scPt = null; });
  const scParts = scaleCubes.map(c => ({ c, layers: [c.layer], tint: c.stops.flat(), over: p => !!c.poly && inPoly(p, c.poly), x: 0, drawn: null }));
  const stepScaleTint = dt => stepPartTint(scParts.sort((a, b) => (b.c.z || 0) - (a.c.z || 0)), scPt, dt);

  // ---------- 08: depth hand-off — the thick slab passes its depth along the stack ----------
  // Three slabs drawn like 04 (a stack laid on its side). One is thick; each step it thins to
  // the others' depth while the next one thickens to its depth, at the same time, so the stack
  // keeps its overall width: 01 → 02 → 03 → 02 → 01, then again. Geometry from the Figma frames
  // (7773:4587 / 4605 / 4619): each slab is a rhombus face 200 wide and 346 tall on the right,
  // plus its depth to the left; later slabs draw on top.
  const DEPTH_STEP_MS = 1500;                  // one hand-off at speed 1×
  const depthCard = $('#card-depth');
  const DSEQ = [0, 1, 2, 1];                   // which slab is thick after each step
  const D_THIN = 29.945, D_FIG_THICK = 129.945, D_GAPS = [79.5, 99.5], D_LEFT = 216, D_Y = 540.47, D_H = 173;
  const depthSlabs = [0, 1, 2].map(i => {
    const layer = document.createElement('div');
    layer.className = 'layer';
    const blur = document.createElement('div');
    blur.className = 'blur filled';
    blur.style.setProperty('--fill-a', '50%');
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 1080 1080'); svg.setAttribute('fill', 'none'); svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = `<defs>${[0, 1, 2].map(k => `<linearGradient id="dp${i}g${k}" gradientUnits="userSpaceOnUse">
        <stop stop-color="#353232"/><stop offset="1" stop-color="#353232" stop-opacity="0"/></linearGradient>`).join('')}</defs>
      ${[0, 1, 2].map(k => `<line stroke="url(#dp${i}g${k})"/>`).join('')}<path stroke="#FDFCFC"/>`;
    layer.append(blur, svg);
    depthCard.appendChild(layer);
    return { layer, blur, svg, lines: [...svg.querySelectorAll('line')], grads: [...svg.querySelectorAll('linearGradient')],
      stops: [...svg.querySelectorAll('stop')], outline: svg.querySelector('path'), poly: null, key: null };
  });
  function drawSlab(c, L, t) {
    const f = n => n.toFixed(2), Y = D_Y, H = D_H;
    const hex = [[L, Y], [L + 100, Y - H], [L + 100 + t, Y - H], [L + 200 + t, Y], [L + 100 + t, Y + H], [L + 100, Y + H]];
    const key = f(L) + '/' + f(t);
    if (c.key === key) return;
    c.key = key;
    c.outline.setAttribute('d', 'M' + hex.map(([x, y]) => `${f(x)} ${f(y)}`).join('L') + 'Z');
    // inner edges run from the face's back corner: up, down, and back along the depth
    const v = [L + t, Y], ends = [[L + 100 + t, Y - H], [L + 100 + t, Y + H], [L, Y]];
    c.lines.forEach((ln, k) => {
      for (const el of [ln, c.grads[k]]) {
        el.setAttribute('x1', f(v[0])); el.setAttribute('y1', f(v[1]));
        el.setAttribute('x2', f(ends[k][0])); el.setAttribute('y2', f(ends[k][1]));
      }
      ln.setAttribute('visibility', k === 2 && t < 1 ? 'hidden' : 'visible');
    });
    setMask(c.blur, hex);
    c.poly = hex;
  }
  let dP = 0, dVel = 0, dHover = false, dRet = null, dPt = null;
  function renderDepth() {
    const n = Math.floor(dP), f = dP - n, step = ((n % 4) + 4) % 4;
    const e = ease(f / Math.max(0.01, 1 - cfg.depth.hold));   // the hand-off, then a pause
    const a = DSEQ[step], b = DSEQ[(step + 1) % 4], thick = cfg.depth.size;
    const T = [0, 1, 2].map(i => i === a ? lerp(thick, D_THIN, e) : i === b ? lerp(D_THIN, thick, e) : D_THIN);
    let L = D_LEFT - (thick - D_FIG_THICK) / 2;   // a different Depth stays centred on the Figma frame
    depthSlabs.forEach((c, i) => { drawSlab(c, L, T[i]); if (i < 2) L += D_GAPS[i] + (T[i] - D_THIN); });
  }
  const depthFig = e => { const r = depthCard.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 1080, (e.clientY - r.top) / r.height * 1080]; };
  depthCard.addEventListener('pointerenter', e => { dHover = true; dPt = depthFig(e); });
  depthCard.addEventListener('pointermove', e => { dPt = depthFig(e); });
  depthCard.addEventListener('pointerleave', () => { dHover = false; dPt = null; });
  // hover tint per slab, topmost first
  const depthParts = [...depthSlabs].reverse().map(c => ({ layers: [c.layer], tint: c.stops, over: p => !!c.poly && inPoly(p, c.poly), x: 0, drawn: null }));
  function stepDepth(dt) {
    const sp = cfg.motion.speed, full = sp / (4 * DEPTH_STEP_MS);
    if (!(dHover || cfg.preview) && (dRet || dVel > 0 || dP % 4 !== 0)) {
      // Return to rest: finish the cycle, back to the Figma frame with 01 thick
      if (!dRet) dRet = startGlide(dP / 4, dVel * full, full);
      dVel = ramp(dVel, false, dt);
      if (!dRet.done) { glide(dRet, dt); dP = dRet.x * 4; renderDepth(); }
      if (dRet.done) { dP = ((dP % 4) + 4) % 4; renderDepth(); if (dVel === 0) dRet = null; }
    } else {
      if (dRet) { dRet = null; dP = ((dP % 4) + 4) % 4; }
      dVel = ramp(dVel, dHover || cfg.preview, dt);
      if (dVel > 0) { dP = (dP + dt * dVel * sp / DEPTH_STEP_MS) % 4; renderDepth(); }
    }
    stepPartTint(depthParts, dPt, dt);
  }

  // ---------- Follow pointer ----------
  // Every stroke near the pointer lights up, fading out by the Radius control, instead of the
  // hovered shape as a whole. The pointer is smoothed, and the effect fades in and out with the
  // hover. Each layer's own offset (_off, _scale, _c) maps the pointer into the layer's space.
  // Radius: Figma px of reach. Blur: the share of the radius that fades out; the rest is a
  // fully lit core. 100% fades all the way from the pointer.
  const spotR = () => cfg.look.spotR, spotCore = () => 1 - cfg.look.spotSoft;
  const spotAmt = d => { const R = spotR(), c = spotCore(); return d <= c * R ? 1 : c >= 1 ? 0 : falloff((d / R - c) / (1 - c)); };
  // outline gradient stops for the current Blur: offset, strength
  const spotStops = () => { const c = spotCore(); return [[0, 1], ...[0, 0.25, 0.5, 0.75, 1].map(t => [c + (1 - c) * t, falloff(t)])]; };
  let spotKey = null;
  const followCards = [];
  let spots = 0;
  for (const card of document.querySelectorAll('.grid .card')) {
    const F = { card, p: null, ps: null, pres: 0, idle: true, layers: [] };
    const fig = e => { const r = card.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 1080, (e.clientY - r.top) / r.height * 1080]; };
    card.addEventListener('pointerenter', e => { F.p = fig(e); });
    card.addEventListener('pointermove', e => { F.p = fig(e); });
    card.addEventListener('pointerleave', () => { F.p = null; });
    for (const layer of card.querySelectorAll(':scope > .layer')) {
      const svg = layer.querySelector(':scope > svg');
      if (!svg) continue;
      const grads = [...new Set([...svg.querySelectorAll('[stroke^="url(#"]')]
        .map(el => document.getElementById(el.getAttribute('stroke').slice(5, -1))).filter(Boolean))];
      const stops = grads.flatMap(g => [...g.querySelectorAll('stop')].map(st => ({ st, g, off: +(st.getAttribute('offset') || 0), d: null })));
      let spot = null;
      if (svg.querySelector('[stroke="#FDFCFC"]')) {
        const id = 'spot' + ++spots;
        svg.insertAdjacentHTML('afterbegin', `<defs><radialGradient class="spot" id="${id}" gradientUnits="userSpaceOnUse">${
          '<stop/>'.repeat(6)}</radialGradient></defs>`);
        spot = svg.querySelector('#' + id);
        layer.style.setProperty('--spot', `url(#${id})`);
      }
      if (spot || stops.length) F.layers.push({ layer, stops, spot });
    }
    followCards.push(F);
  }
  function stepFollow(dt) {
    if (!cfg.look.follow) return;
    const key = spotR() + '/' + spotCore();
    if (spotKey !== key) {   // Radius or Blur changed: reshape every outline gradient
      const st = spotStops();
      for (const F of followCards) for (const L of F.layers) if (L.spot) {
        L.spot.setAttribute('r', spotR());
        [...L.spot.children].forEach((el, i) => { el.setAttribute('offset', st[i][0].toFixed(3)); el.style.setProperty('--w', st[i][1].toFixed(3)); });
      }
      for (const F of followCards) F.idle = false;   // redraw the inner edges too
      spotKey = key;
    }
    const tau = CURVES[cfg.motion.curve].response / cfg.motion.speed / 4 * 1000;
    const a = reduceMotion.matches ? 1 : 1 - Math.exp(-dt / 70);   // pointer smoothing
    for (const F of followCards) {
      const target = F.p ? 1 : 0;
      F.pres = reduceMotion.matches ? target : F.pres + (target - F.pres) * (1 - Math.exp(-dt / tau));
      if (Math.abs(target - F.pres) < 0.002) F.pres = target;
      if (F.p) F.ps = F.ps ? [lerp(F.ps[0], F.p[0], a), lerp(F.ps[1], F.p[1], a)] : F.p.slice();
      if (F.pres === 0 && F.idle) continue;
      F.idle = F.pres === 0;
      F.card.style.setProperty('--pres', F.pres.toFixed(3));
      if (!F.ps) continue;
      for (const L of F.layers) {
        const el = L.layer, off = el._off || [0, 0], sc = el._scale || 1, c = el._c || [540, 540];
        const x = c[0] + (F.ps[0] - off[0] - c[0]) / sc, y = c[1] + (F.ps[1] - off[1] - c[1]) / sc;
        if (L.spot) { L.spot.setAttribute('cx', x.toFixed(1)); L.spot.setAttribute('cy', y.toFixed(1)); }
        for (const S of L.stops) {
          const g = S.g, x1 = +g.getAttribute('x1'), y1 = +g.getAttribute('y1');
          const sx = x1 + (+g.getAttribute('x2') - x1) * S.off, sy = y1 + (+g.getAttribute('y2') - y1) * S.off;
          const d = Math.hypot(sx - x, sy - y);
          const v = (Number.isFinite(d) ? F.pres * spotAmt(d) : 0).toFixed(3);
          if (S.d !== v) { S.st.style.setProperty('--fhot', v); S.d = v; }
        }
      }
    }
  }

  function tick(now) {
    const dt = Math.min(64, now - last); last = now;
    stepHover(dt);
    stepGrow(dt);
    const sp = cfg.motion.speed;
    const holeOn = holeHover || cfg.preview;
    if (!holeOn && (holeRet || vel > 0 || u !== 0)) {
      // Return to rest: finish the cycle (u = 1 looks the same as u = 0)
      if (!holeRet) holeRet = startGlide(u, vel * sp / BASE_LOOP_MS, sp / BASE_LOOP_MS);
      vel = ramp(vel, false, dt);                       // only fades the tint now
      if (!holeRet.done) { glide(holeRet, dt); u = holeRet.x; renderHole(); }
      if (holeRet.done) { u = ((u % 1) + 1) % 1; renderHole(); if (vel === 0) holeRet = null; }
    } else {
      if (holeRet) { holeRet = null; u = ((u % 1) + 1) % 1; }
      vel = ramp(vel, holeOn, dt);
      if (vel > 0) {
        u = (u + dt * vel * sp / BASE_LOOP_MS) % 1;
        renderHole();
      }
    }
    stepHoleTint(dt);
    const scOn = scHover || cfg.preview;
    if (!scOn && (scRet || scVel > 0 || scP % 1 !== 0)) {
      // Return to rest: finish the step it is in; every step boundary shows the Figma frame
      if (!scRet) scRet = startGlide(scP, scVel * sp / SCALE_LOOP_MS, sp / SCALE_LOOP_MS);
      scVel = ramp(scVel, false, dt);
      if (!scRet.done) { glide(scRet, dt); scP = scRet.x; renderScale(); }
      if (scRet.done) { scP = ((scP % 4) + 4) % 4; renderScale(); if (scVel === 0) scRet = null; }
    } else {
      if (scRet) { scRet = null; scP = ((scP % 4) + 4) % 4; }
      scVel = ramp(scVel, scOn, dt);
      if (scVel > 0) {
        scP = (scP + dt * scVel * sp / SCALE_LOOP_MS) % 4;
        renderScale();
      }
    }
    stepScaleTint(dt);
    stepDepth(dt);
    stepFollow(dt);
    requestAnimationFrame(tick);
  }

  // ---------- controls ----------
  const panel = $('#panel');
  // each spring's step response on a shared 1.6s time axis, so the icons also compare speed
  // (drawn with the current Bounce, so the icons show the overshoot too)
  const curveIcon = ({ response }) => {
    const w = 2 * Math.PI / response, k = w * w, c = 2 * damping() * w, T = 1.6, N = 64, hs = T / N / 8;
    let x = 0, v = 0, d = 'M4 30';
    for (let i = 1; i <= N; i++) {
      for (let j = 0; j < 8; j++) { v += (k * (1 - x) - c * v) * hs; x += v * hs; }
      d += `L${(4 + i / N * 72).toFixed(1)} ${(30 - x * 24).toFixed(1)}`;
    }
    return `<svg viewBox="0 0 80 34" aria-hidden="true"><path d="${d}"/></svg>`;
  };
  // Side panel: only what every animation shares
  const SECTIONS = [
    { title: 'Motion', note: 'Shared by every animation on the page. Loops always finish their cycle and come to rest when the pointer leaves.', key: 'motion', fields: [
      { k: 'speed',     label: 'Speed',      min: 0.25, max: 3, step: 0.05, fmt: v => v.toFixed(2) + '×' },
      { k: 'curve', type: 'curves' },
      { k: 'bounce',    label: 'Bounce',     min: 0, max: 1, step: 0.01, fmt: v => Math.round(v * 100) + '%' },
      { k: 'fade',      label: 'Fades',      min: 0.1, max: 1, step: 0.01, fmt: v => Math.round(v * 100) + '%' },
      { k: 'smoothing', label: 'Start/stop', min: 0, max: 1000, step: 10, fmt: v => v + 'ms' },
    ]},
    { title: 'BG Blur', note: 'Background blur behind every layer.', key: 'look', fields: [
      { k: 'blur', label: 'Blur', min: 0, max: 24, step: 1, fmt: v => v + 'px' },
      { k: 'colorize', type: 'check', label: 'Colorize' },
      { k: 'outline', type: 'check', label: 'Colorize outline' },
      { k: 'follow', type: 'check', label: 'Follow pointer', rebuild: true },
      // only while Follow pointer is on: reach of the reveal, and how much of it is a soft edge
      { k: 'spotR',    label: 'Radius', min: 80, max: 800, step: 10, fmt: v => v + 'px', when: () => cfg.look.follow },
      { k: 'spotSoft', label: 'Blur',   min: 0, max: 1, step: 0.01, fmt: v => Math.round(v * 100) + '%', when: () => cfg.look.follow },
    ]},
  ];
  // Each card's own parameters, in a collapsed dropdown inside the card
  const px = v => v + 'px', pct = v => Math.round(v * 100) + '%', deg = v => v + '°';
  const LIFT = [
    { k: 'strength',  label: 'Strength',  min: 0, max: 60, step: 1, fmt: px },
    { k: 'influence', label: 'Influence', min: 0, max: 1, step: 0.01, fmt: pct },
  ];
  // Spin: how far each hover turns the layer, in quarter turns (90° steps), up to two full turns
  const SPIN = { k: 'spin', label: 'Spin', min: 0, max: 720, step: 90, fmt: deg };
  const CARD_PARAMS = {
    cubes:  { note: 'Influence spreads the hover to nearby layers; Spin turns the hovered cube to the right.', fields: [...LIFT, SPIN] },
    stack:  { note: 'Influence spreads the hover to nearby layers; Spin turns the hovered layer to the right, in 90° steps.', fields: [...LIFT, SPIN] },
    slices: { note: 'Influence spreads the hover to nearby layers; Spin turns the hovered slice upward, in 90° steps.', fields: [...LIFT, SPIN] },
    scale:  { note: 'Spin on the cube’s own axis once it lands in the middle. Entry: how far below the new cube starts, so it comes in with momentum.', fields: [
      SPIN, { k: 'entry', label: 'Entry', min: 0, max: 400, step: 10, fmt: px },
      { k: 'flip', type: 'check', label: 'Flip horizontal (enter left, leave right)' }] },
    orbit:  { note: 'Influence spreads the hover to nearby satellites; Spin turns the hovered one to the right.', fields: [...LIFT, SPIN] },
    grow:   { note: 'The hovered cube grows by Size and turns by Spin; the others move away from it, Push px at the nearest, fading out by Reach.', fields: [
      { k: 'size',  label: 'Size',  min: 0, max: 1, step: 0.05, fmt: v => '+' + pct(v) },
      { k: 'push',  label: 'Push',  min: 0, max: 120, step: 2, fmt: px },
      { k: 'reach', label: 'Reach', min: 150, max: 900, step: 10, fmt: px },
      SPIN] },
    depth:  { note: 'The thick slab hands its depth to the next one: 01 → 02 → 03 → 02 → 01. Depth: how thick it gets; Pause: the share of each step it holds before the next hand-off.', fields: [
      { k: 'size', label: 'Depth', min: 60, max: 260, step: 2, fmt: px },
      { k: 'hold', label: 'Pause', min: 0, max: 0.7, step: 0.01, fmt: pct }] },
  };

  const COLORIZE = '#99C5E1';   // hover tint of the inner edges when Colorize is on
  function applyLook() {
    const root = document.documentElement.style;
    root.setProperty('--blur', cfg.look.blur + 'px');
    if (cfg.look.colorize) root.setProperty('--tint', COLORIZE); else root.removeProperty('--tint');
    if (cfg.look.outline) root.setProperty('--otint', COLORIZE); else root.removeProperty('--otint');
    document.documentElement.classList.toggle('follow', !!cfg.look.follow);
  }
  function applyLayout() {
    document.querySelectorAll('.grid').forEach(g => g.dataset.cols = cfg.layout.cols);
    document.querySelectorAll('#cols button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === cfg.layout.cols));
  }
  document.querySelectorAll('#cols button').forEach(b => b.onclick = () => { cfg.layout.cols = +b.dataset.v; save(); applyLayout(); });

  function applyAll() { applyHover(); renderHole(); renderScale(); renderDepth(); applyLook(); applyLayout(); }

  // one control row: a slider, a checkbox or the curve presets, bound to obj[f.k]
  function fieldRow(f, obj, id) {
    const row = document.createElement('div');
    if (f.type === 'curves') {
      row.className = 'curves'; row.setAttribute('role', 'group'); row.setAttribute('aria-label', 'Curve');
      row.innerHTML = Object.entries(CURVES).map(([k, c]) =>
        `<button class="curve" data-k="${k}" aria-pressed="${obj.curve === k}" title="spring · ${c.response}s">${curveIcon(c)}${c.label}</button>`).join('');
      row.querySelectorAll('button').forEach(b => b.onclick = () => {
        obj.curve = b.dataset.k; save(); applyAll();
        row.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      });
    } else if (f.type === 'check') {
      row.innerHTML = `<label class="check"><input id="${id}" type="checkbox" ${obj[f.k] ? 'checked' : ''}> ${f.label}</label>`;
      row.querySelector('input').onchange = e => { obj[f.k] = e.target.checked; save(); applyAll(); if (f.rebuild) buildPanel(); };
    } else {
      row.className = 'row';
      row.innerHTML = `<label for="${id}">${f.label}</label>
        <input id="${id}" type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${obj[f.k]}"><output>${f.fmt(obj[f.k])}</output>`;
      const inp = row.querySelector('input'), out = row.querySelector('output');
      inp.oninput = () => {
        obj[f.k] = +inp.value; out.textContent = f.fmt(+inp.value); save(); applyAll();
        if (f.k === 'bounce') panel.querySelectorAll('.curve').forEach(b => {   // redraw the curves with the new bounce
          b.querySelector('svg').outerHTML = curveIcon(CURVES[b.dataset.k]);
        });
      };
    }
    return row;
  }

  // Customize parameters: a closed dropdown in each card that has its own settings
  function buildCardParams(key) {
    const card = $('#card-' + key), def = CARD_PARAMS[key];
    let tune = card.querySelector('.tune');
    const wasOpen = !!(tune && tune.open);
    if (!tune) {
      tune = document.createElement('details');
      tune.className = 'tune';
      card.appendChild(tune);
    }
    tune.open = wasOpen;
    tune.innerHTML = `<summary>Customize parameters</summary><div class="tune-body"><p>${def.note}</p></div>`;
    const body = tune.querySelector('.tune-body');
    for (const f of def.fields) body.appendChild(fieldRow(f, cfg[key], `${key}-${f.k}`));
    const reset = document.createElement('button');
    reset.className = 'link'; reset.type = 'button'; reset.textContent = 'Reset this card';
    reset.onclick = () => { cfg[key] = clone(DEFAULTS[key]); save(); buildCardParams(key); applyAll(); };
    body.appendChild(reset);
  }
  const buildAllCardParams = () => Object.keys(CARD_PARAMS).forEach(buildCardParams);

  function buildPanel() {
    panel.innerHTML = '';
    for (const sec of SECTIONS) {
      panel.insertAdjacentHTML('beforeend', `<h2>${sec.title}</h2><p>${sec.note}</p>`);
      for (const f of sec.fields) if (!f.when || f.when()) panel.appendChild(fieldRow(f, cfg[sec.key], `${sec.key}-${f.k}`));
    }
    panel.insertAdjacentHTML('beforeend', `
      <h2>Preview</h2>
      <label class="check"><input id="preview" type="checkbox" ${cfg.preview ? 'checked' : ''}> Hover everything</label>
      <div class="actions"><button class="btn" id="copy">Copy config JSON</button><button class="btn" id="reset">Reset all</button></div>
      <div class="toast" id="toast"></div>`);
    $('#preview').onchange = e => {
      cfg.preview = e.target.checked;
      applyAll();
    };
    $('#copy').onclick = async () => {
      const lift = k => ({ strength: cfg[k].strength, influence: cfg[k].influence, influenceRadiusPx: Math.round(cfg[k].influence * INFLUENCE_RADIUS) });
      const txt = JSON.stringify({
        motion: { speed: cfg.motion.speed, curve: cfg.motion.curve, bounce: cfg.motion.bounce, fades: cfg.motion.fade,
          startStopMs: cfg.motion.smoothing, returnToRest: { direction: 'always forward, finishes the cycle', curve: 'cubic Hermite ease-out from current speed', durationVsFullSpeed: RETURN_SLOW },
          hoverSpring: { responseS: +(CURVES[cfg.motion.curve].response / cfg.motion.speed).toFixed(3), damping: +damping().toFixed(3) },
          timedMoves: 'smootherstep + bounce overshoot' },
        backgroundBlur: `blur(${cfg.look.blur}px), every layer`,
        hoverTint: cfg.look.colorize ? COLORIZE : 'theme grey',
        hoveredOutline: cfg.look.outline ? `${COLORIZE}, only the shape under the cursor` : 'unchanged',
        followPointer: cfg.look.follow ? { radiusPx: cfg.look.spotR, blurPct: Math.round(cfg.look.spotSoft * 100), falloff: 'smoothstep over the blurred share of the radius', pointerSmoothingMs: 70 } : false,
        cubes: { ...lift('cubes'), spinDeg: cfg.cubes.spin },
        stack: { ...lift('stack'), spinDeg: cfg.stack.spin, spinDirection: 'right' },
        hole: { loopMs: Math.round(BASE_LOOP_MS / cfg.motion.speed), motion: 'linear' },
        slices: { ...lift('slices'), spinDeg: cfg.slices.spin, spinDirection: 'up' },
        scale: { stepMs: Math.round(SCALE_LOOP_MS / cfg.motion.speed), phases: { move: SCALE_PHASES[0], hold: SCALE_PHASES[1], spin: SCALE_PHASES[2], holdAfter: +(1 - SCALE_PHASES.reduce((a, b) => a + b)).toFixed(2) },
          edgeFade: { goneBeforeEdgePx: EDGE_PAD, fadePx: EDGE_FADE }, spinDeg: cfg.scale.spin, spinAxis: 'own vertical axis, to the right',
          moveCurve: 'sine ease-in-out', maxCubesOnScreen: 3, fadeShareOfHalfStep: cfg.motion.fade,
          entry: { fromPx: cfg.scale.entry, curve: 'cubic ease-out over the second half of the move' },
          direction: cfg.scale.flip ? 'left to right' : 'bottom to top' },
        orbit: { ...lift('orbit'), spinDeg: cfg.orbit.spin },
        grow: { sizePct: Math.round(cfg.grow.size * 100), pushPx: cfg.grow.push, reachPx: cfg.grow.reach, spinDeg: cfg.grow.spin, motion: 'shared hover spring', push: 'radially away from the hovered cube, smoothstep falloff' },
        depth: { stepMs: Math.round(DEPTH_STEP_MS / cfg.motion.speed), order: '01 → 02 → 03 → 02 → 01', thickPx: cfg.depth.size, thinPx: +D_THIN.toFixed(1),
          pausePct: Math.round(cfg.depth.hold * 100), curve: 'smootherstep + bounce overshoot', both: 'the thick slab thins while the next one thickens, stack width stays the same' },
        cardsPerRow: cfg.layout.cols,
      }, null, 2);
      try { await navigator.clipboard.writeText(txt); $('#toast').textContent = 'Copied to clipboard.'; }
      catch {
        let ta = panel.querySelector('.copy-fallback');
        if (!ta) { ta = document.createElement('textarea'); ta.className = 'copy-fallback'; ta.id = 'copy-fallback'; ta.readOnly = true; panel.appendChild(ta); }
        ta.value = txt; ta.focus(); ta.select();
        $('#toast').textContent = 'Clipboard unavailable here: the config is selected below, copy it with Ctrl+C.';
      }
    };
    $('#reset').onclick = () => {
      cfg = clone(DEFAULTS); save();
      buildPanel(); buildAllCardParams(); applyAll();
    };
  }

  // theme
  let theme = null;
  try { theme = localStorage.getItem(KEY + '-theme'); } catch {}
  function setTheme(v) {
    if (v === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = v;
    try { localStorage.setItem(KEY + '-theme', v); } catch {}
    document.querySelectorAll('#theme button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  }
  document.querySelectorAll('#theme button').forEach(b => b.onclick = () => setTheme(b.dataset.v));

  if (theme) setTheme(theme);
  else document.querySelectorAll('#theme button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.v === (document.documentElement.dataset.theme || 'system')));
  buildPanel();
  buildAllCardParams();
  applyAll();
  requestAnimationFrame(tick);
  // console handle for scrubbing the loop: __motion.seek(0..1)
  window.__motion = { seek: v => { u = v; renderHole(); }, seekScale: v => { scP = v; renderScale(); }, seekDepth: v => { dP = v; renderDepth(); },
    // pose a spinning layer at an angle (degrees): __motion.spinAt('stack-layer-3', 45)
    spinAt: (id, deg) => { for (const h of HOVER) { const sp = h.byId[id]; if (sp && sp.spin) { sp.spin.a = sp.spin.target = deg * Math.PI / 180; if (deg % 90) sp.spin.draw(sp.layer.blur); else sp.spin.restore(sp.layer.blur); } } } };
})();
</script>
